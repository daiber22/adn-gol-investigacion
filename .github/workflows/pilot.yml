name: ADN del Gol - LaLiga masculina absoluta
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      competition:
        description: 'StatsBomb competition ID'
        required: true
        default: '11'
      season:
        description: 'StatsBomb season ID'
        required: true
        default: '1'
      limit:
        description: 'Partidos a procesar (lote pequeño)'
        required: true
        default: '300'
permissions:
  contents: read
jobs:
  pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tests -v
      - run: python -m src.pipeline --competition '${{ inputs.competition || '11' }}' --season '${{ inputs.season || '1' }}' --limit '${{ inputs.limit || '300' }}'
      - name: Build chronological five-match pre-profiles
        run: python -m src.pre_profiles --competition '${{ inputs.competition || '11' }}' --season '${{ inputs.season || '1' }}' --limit 300 --prior 5
      - name: Compare traditional baseline against counterattack clash
        run: python -m src.evaluate --competition '${{ inputs.competition || '11' }}' --season '${{ inputs.season || '1' }}' --limit 300
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: adn-gol-pilot
          path: data/processed/
          retention-days: 30
