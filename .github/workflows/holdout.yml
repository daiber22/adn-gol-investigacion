name: ADN del Gol - Premier League masculina absoluta
on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - '.github/workflows/holdout.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  holdout:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tests -v
      - name: Procesar temporada independiente 2023-24
        run: python -m src.pipeline --competition 2 --season 27 --limit 380
      - name: Construir perfiles solo con cinco partidos anteriores
        run: python -m src.pre_profiles --competition 2 --season 27 --limit 380 --prior 5
      - name: Evaluar ADN y empates en temporada no usada previamente
        run: python -m src.evaluate --competition 2 --season 27 --limit 380
      - name: Diagnosticar aciertos, empates y choque ofensivo-defensivo
        run: python -m src.diagnose
      - name: Auditar partidos cuyo pronostico cambio
        run: python -m src.audit_changes
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: adn-gol-premier-league-masculina
          path: data/processed/
          retention-days: 30
