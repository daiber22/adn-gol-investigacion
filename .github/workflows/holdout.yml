name: ADN del Gol - Validacion independiente 2023-24
on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - '.github/workflows/holdout.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  holdout:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tests -v
      - name: Procesar temporada independiente 2023-24
        run: python -m src.pipeline --competition 37 --season 281 --limit 132
      - name: Construir perfiles solo con cinco partidos anteriores
        run: python -m src.pre_profiles --competition 37 --season 281 --limit 132 --prior 5
      - name: Evaluar ADN y empates en temporada no usada previamente
        run: python -m src.evaluate --competition 37 --season 281 --limit 132
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: adn-gol-holdout-2023-24
          path: data/processed/
          retention-days: 30
